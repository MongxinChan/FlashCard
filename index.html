<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sketch2UI - AI 代码生成器</title>
    
    <!-- 核心库 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/lucide-react@latest/dist/lucide-react.min.js"></script>

    <style>
        body { background-color: #f3f4f6; }
        .glass-panel { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
        .loading-spinner {
            border: 4px solid #f3f3f3; border-top: 4px solid #3b82f6; border-radius: 50%;
            width: 24px; height: 24px; animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="text-gray-800 h-screen flex flex-col overflow-hidden">
    <!-- 顶部导航 -->
    <header class="bg-white border-b border-gray-200 px-6 py-4 flex items-center justify-between shrink-0 z-10">
        <div class="flex items-center gap-3">
            <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-600 to-purple-600">Sketch2UI</h1>
        </div>
        <div class="text-sm text-gray-500 flex items-center gap-2">
            <span id="status-indicator" class="w-2 h-2 rounded-full bg-green-500"></span>
            <span>已连接后端</span>
        </div>
    </header>

    <!-- 主体内容 -->
    <main class="flex-1 flex gap-4 p-4 overflow-hidden relative">
        <!-- 左侧面板 -->
        <div class="w-1/4 min-w-[300px] flex flex-col gap-4">
            <div class="bg-white rounded-xl shadow-sm p-4 flex-1 flex flex-col border border-gray-200">
                <h2 class="font-semibold mb-3">上传草图</h2>
                <div id="drop-zone" class="border-2 border-dashed border-gray-300 rounded-lg flex-1 flex flex-col items-center justify-center p-6 cursor-pointer hover:border-blue-500 hover:bg-blue-50 bg-gray-50 relative overflow-hidden transition-all">
                    <input type="file" id="file-input" class="hidden" accept="image/*">
                    <img id="image-preview" class="absolute inset-0 w-full h-full object-contain p-2 hidden z-10 bg-gray-50" />
                    <div id="upload-prompt" class="text-center">
                        <p class="text-sm font-medium text-gray-700">点击上传图片</p>
                    </div>
                </div>
                <div class="mt-4">
                    <textarea id="prompt-input" class="w-full text-sm border border-gray-300 rounded-lg p-3 outline-none resize-none h-20 focus:border-blue-500" placeholder="补充描述 (例如: 按钮要是红色的)"></textarea>
                </div>
                <button id="generate-btn" class="mt-4 w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 px-4 rounded-lg flex items-center justify-center gap-2 disabled:opacity-50 transition-colors">
                    <span class="btn-text">生成界面</span>
                    <div class="loading-spinner hidden"></div>
                </button>
            </div>
        </div>

        <!-- 中间面板：代码 -->
        <div class="w-1/3 min-w-[350px] bg-white rounded-xl shadow-sm border border-gray-200 flex flex-col overflow-hidden">
            <div class="bg-gray-50 border-b border-gray-200 px-4 py-2 flex justify-between items-center">
                <span class="text-xs font-semibold text-gray-500 uppercase">React Code</span>
            </div>
            <textarea id="code-editor" class="flex-1 w-full bg-[#1e1e1e] text-gray-300 font-mono text-sm p-4 outline-none resize-none" spellcheck="false" placeholder="// 代码将在这里生成..."></textarea>
        </div>

        <!-- 右侧面板：预览 -->
        <div class="flex-1 bg-white rounded-xl shadow-sm border border-gray-200 flex flex-col overflow-hidden">
            <div class="bg-gray-50 border-b border-gray-200 px-4 py-2 flex justify-between items-center">
                <span class="text-xs font-semibold text-gray-500 uppercase">Live Preview</span>
                <button id="refresh-preview" class="text-xs bg-gray-200 hover:bg-gray-300 px-2 py-1 rounded">刷新</button>
            </div>
            <div class="flex-1 relative bg-gray-100">
                <iframe id="preview-frame" class="w-full h-full border-0"></iframe>
            </div>
        </div>
    </main>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const imagePreview = document.getElementById('image-preview');
        const uploadPrompt = document.getElementById('upload-prompt');
        const generateBtn = document.getElementById('generate-btn');
        const codeEditor = document.getElementById('code-editor');
        const previewFrame = document.getElementById('preview-frame');
        
        let currentFile = null;

        // 上传处理
        dropZone.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => handleFile(e.target.files[0]));
        dropZone.addEventListener('dragover', (e) => e.preventDefault());
        dropZone.addEventListener('drop', (e) => { e.preventDefault(); handleFile(e.dataTransfer.files[0]); });

        function handleFile(file) {
            if (!file || !file.type.startsWith('image/')) return;
            currentFile = file;
            const reader = new FileReader();
            reader.onload = (e) => {
                imagePreview.src = e.target.result;
                imagePreview.classList.remove('hidden');
                uploadPrompt.classList.add('hidden');
            };
            reader.readAsDataURL(file);
        }

        // 生成代码
        generateBtn.addEventListener('click', async () => {
            if (!currentFile) return alert('请先上传图片');
            
            setLoading(true);
            const formData = new FormData();
            formData.append('image', currentFile);
            formData.append('prompt', document.getElementById('prompt-input').value);

            try {
                const res = await fetch('/generate-code', { method: 'POST', body: formData });
                const data = await res.json();
                
                if (data.success) {
                    codeEditor.value = data.code;
                    updatePreview(data.code);
                } else {
                    alert('错误: ' + data.error);
                }
            } catch (e) {
                alert('请求失败: ' + e.message);
            } finally {
                setLoading(false);
            }
        });

        function setLoading(loading) {
            generateBtn.disabled = loading;
            generateBtn.querySelector('.btn-text').textContent = loading ? '正在生成...' : '生成界面';
            generateBtn.querySelector('.loading-spinner').classList.toggle('hidden', !loading);
        }

        // 预览引擎
        document.getElementById('refresh-preview').addEventListener('click', () => updatePreview(codeEditor.value));

        function updatePreview(code) {
            if (!code) return;
            
            // 清理代码以适应浏览器环境
            let cleanCode = code
                .replace(/import\s+.*?from\s+['"].*?['"];?/g, '')
                .replace(/export\s+default\s+/g, '');
                
            let compName = 'App';
            const match = cleanCode.match(/function\s+([A-Z][a-zA-Z0-9]*)/);
            if (match) compName = match[1];

            const html = `
                <!DOCTYPE html>
                <html>
                <head>
                    <script src="https://cdn.tailwindcss.com"><\/script>
                    <script src="https://unpkg.com/react@18/umd/react.development.js"><\/script>
                    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"><\/script>
                    <script src="https://unpkg.com/@babel/standalone/babel.min.js"><\/script>
                    <script src="https://unpkg.com/lucide@latest"><\/script>
                    <script src="https://unpkg.com/lucide-react@latest/dist/lucide-react.min.js"><\/script>
                </head>
                <body class="bg-white p-4">
                    <div id="root"></div>
                    <script type="text/babel">
                        const { useState, useEffect, useRef } = React;
                        const icons = window.LucideReact ? window.LucideReact : {};
                        Object.assign(window, icons);
                        
                        try {
                            ${cleanCode}
                            const root = ReactDOM.createRoot(document.getElementById('root'));
                            root.render(<${compName} />);
                        } catch (e) {
                            document.body.innerHTML = '<div class="text-red-500">预览错误: ' + e.message + '</div>';
                        }
                    <\/script>
                </body>
                </html>
            `;
            const doc = previewFrame.contentWindow.document;
            doc.open(); doc.write(html); doc.close();
        }
    </script>
</body>
</html>
